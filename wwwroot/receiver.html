<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Robot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="theme-receiver">
    <div class="container mt-5">

        <!-- Setup -->
        <div id="setup-panel" class="card mx-auto p-4" style="max-width:500px">
            <h4 class="text-warning mb-3">🤖 Robot Kurulumu</h4>
            <input type="text" id="robot-name" class="form-control mb-3" placeholder="Robot İsmi (Örn: Rover1)">
            <input type="password" id="robot-pass" class="form-control mb-3" placeholder="Oturum Şifresi">
            <select id="robot-type" class="form-select mb-3">
                <option value="Car">Araba/Rover</option>
                <option value="Drone">Drone</option>
                <option value="Arm">Robot Kol</option>
            </select>
            <button onclick="startRobot()" class="btn btn-warning w-100 text-dark fw-bold">Online Ol</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="d-none row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card h-100 p-3 text-center">
                    <h5 class="card-title text-muted">Gelen Kuvvet</h5>
                    <div class="d-flex justify-content-center position-relative my-3">
                        <canvas id="vizCanvas"></canvas>
                        <div
                            style="position: absolute; bottom: -20px; width: 100%; text-align: center; color: #aaa; font-size: 0.8rem; font-family: monospace;">
                            Viz</div>
                    </div>
                </div>
            </div>

            <div class="col-md-7 mb-4">
                <div class="card h-100 p-3">
                    <div class="d-flex justify-content-between mb-2">
                        <h5 class="card-title text-muted">Komut Logu</h5>
                        <span id="status-display" class="badge bg-success">Online</span>
                    </div>

                    <div id="log-list" class="log-container" style="height: 300px;">
                        <!-- Logs -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/viz.js"></script>
    <script src="js/receiver.js"></script>
</body>

</html>
