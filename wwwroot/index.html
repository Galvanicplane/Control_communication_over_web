<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlOverWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
        
        <h1 class="display-3 fw-bold mb-5 text-gradient">ControlOverWeb</h1>
        
        <div class="row w-100 justify-content-center text-center">
            <!-- Operator Card -->
            <div class="col-md-5 mb-4">
                <div class="card h-100 bg-secondary bg-opacity-25 border-info hover-scale">
                    <div class="card-body p-5">
                        <div class="display-1 mb-3">🎮</div>
                        <h2 class="card-title">Operator (Sender)</h2>
                        <p class="card-text text-muted">Robotları uzaktan kontrol etmek istiyorum.</p>
                        <a href="sender.html" class="btn btn-info btn-lg w-100 mt-3">Giriş Yap</a>
                    </div>
                </div>
            </div>

            <!-- Robot Card -->
            <div class="col-md-5 mb-4">
                <div class="card h-100 bg-secondary bg-opacity-25 border-warning hover-scale">
                    <div class="card-body p-5">
                        <div class="display-1 mb-3">🤖</div>
                        <h2 class="card-title">Robot (Receiver)</h2>
                        <p class="card-text text-muted">Bu cihaz bir robot olarak çalışacak.</p>
                        <a href="receiver.html" class="btn btn-warning btn-lg w-100 mt-3">Bağlan</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="mt-5 p-3 rounded bg-black bg-opacity-50 border border-secondary text-center">
            <div class="row g-4">
                <div class="col-4 px-4">
                    <h3 id="stat-visitor" class="fw-bold text-primary">0</h3>
                    <small>Ziyaretçi</small>
                </div>
                <div class="col-4 px-4 border-start border-end border-secondary">
                    <h3 id="stat-robots" class="fw-bold text-success">0</h3>
                    <small>Online Robot</small>
                </div>
                <div class="col-4 px-4">
                    <h3 id="stat-commands" class="fw-bold text-danger">0</h3>
                    <small>Komut Geçmişi</small>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a href="PROJE_RAPORU.md" class="text-muted text-decoration-none"><small>📄 Proje Raporunu Oku (IEEE)</small></a>
        </div>
    </div>

    <script>
        // Load stats
        fetch('/api/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('stat-visitor').innerText = data.visitorCount;
                document.getElementById('stat-commands').innerText = data.totalCommandsSent;
                document.getElementById('stat-robots').innerText = data.onlineRobots;
            });
        
        // Record visit
        fetch('/api/stats/visit', { method: 'POST' });
    </script>
    
    <style>
        .hover-scale { transition: transform 0.2s; }
        .hover-scale:hover { transform: scale(1.02); }
        .text-gradient {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</body>
</html>
